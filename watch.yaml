# talog watch 설정 — 예지보전 상주 감시
# (설비 PC 에 배포 시 site 이름만 채우면 기본 감시가 동작합니다.
#  결함명·패턴·사건 분석·메일은 `talog watch --ui` 콘솔에서 설정하는 것이 편합니다)

watch_root: D:\AIV_LOG\Talos     # talos 로그 루트 (YYYY_MM\DD 자동 추적)
poll_seconds: 20                 # 폴링 주기(초) — 새로 쓰인 바이트만 읽음
alert_dir: D:\AIV_LOG\TalogWatch # 예지보전 알림/상태 적재 위치 (별도 폴더)
low_priority: true               # 프로세스 우선순위 강등 (검사 프로그램 보호)
site: ""                         # 설비 식별자 (예: PC3, cmfb#1)
cooldown_min: 30                 # 동일 알림 재발송 억제(분)

tracking:                        # 추적 대상
  mode: default                  # default(핵심 9종) | select(files 만) | auto(일자 폴더 전체)
  files: []                      # select: 파일명·와일드카드 (예: Comm.log, seq_*.log, DLInfer.log)
  exclude: [DebugImageSaveInfo.log, InspCondRelationGraph*.log]   # auto 모드 제외
  include_alg: false             # auto 모드에서 alg\ 하위 알고리즘 로그 포함
  max_initial_mb: 32             # 처음 보는 파일이 이보다 크면 끝부분부터 읽음 (select/auto)

rules:
  error_repeat:                  # 동일 에러 반복
    window_min: 10
    count: 5
  no_insp_thread:                # 검사 시작 거부 = 미검사 임박 (즉시 경보)
    enabled: true
  insp_stall:                    # 검사 정체 (정상 소요 중앙값의 N배) — 정체 검사는 한 경보로 묶음
    factor_x_median: 2.0
    min_seconds: 180
    cooldown_min: 10             # 정체 경보 재발송 간격(분)
  restart_burst:                 # 재시작 빈발
    window_min: 60
    count: 3
  memory_trend:                  # 메모리 증가 추세 (릭 의심)
    mb_per_hour: 100
    min_rise_mb: 500
    min_hours: 2.0
    cooldown_min: 240            # 이 룰만 4시간 쿨다운 (반복 억제)
  gpu_temp:                      # GPU 온도 (nvidia-smi 기본 동봉 — 설치 불필요)
    enabled: true
    celsius: 85                  # 경보 임계 온도
    record_min: 5                # 온도 이력 적재 간격(분) → gpu_날짜.jsonl
  defect_watch:                  # 결함명 감시 (comm.log INSPECT_END 의 NG/REWORK 결함명)
    enabled: true
    critical: []                 # 1건만 나와도 즉시 심각 경보 (예: [BOOT_DAMAGED, "*CRACK*"])
    critical_cooldown_min: 10    # 같은 치명 결함 재경보 간격(분)
    repeat_window_min: 30
    repeat_count: 0              # 같은 결함명이 30분 내 N건이면 주의 (0 = 끔, 권장 10)
    ng_streak: 0                 # 연속 NG N건이면 심각 (0 = 끔, 권장 10)
    ng_rate_window: 0            # 최근 N검사 NG 비율 감시 (0 = 끔)
    ng_rate_percent: 50
  patterns: []                   # 사용자 정의 로그 패턴 — 예:
  #  - name: GPU 컨텍스트 치명 오류
  #    match: enqueueV3 cudaGetLastError      # 문구 포함 (정규식은 "re:" 로 시작)
  #    files: [DLInfer.log]                    # 비우면 추적 중인 전체 파일 (tracking 에 포함돼야 함)
  #    severity: crit                          # info | warn | crit
  #    count: 1                                # window_min 안에 N번 → 경보 (1 = 즉시)
  #    window_min: 10
  #    cooldown_min: 30
  #    family: reject                          # 사건 분석 계열 (system | reject | defect)
  overrides: {}                  # 기본 룰 조정 — 예: {img_timeout: {count: 3, window_min: 10},
  #                                grab_fail: {severity: warn}, alg_timeout: {enabled: false}}

notify:
  toast: true                    # Windows 토스트 팝업
  webhook: ""                    # http(s)://... (Teams/Slack/사내 서버) — 비우면 끔
  jsonl: true                    # alert_dir\alerts_YYYYMMDD.jsonl 적재

llm:                             # 로컬 LLM (Ollama) — 사건 분석·주기 점검 공용
  enabled: false                 # 주기 점검 모드 (지시문 script 기반)
  url: http://127.0.0.1:11434    # Ollama 주소 (GPU 고정 전용 서버·사내 분석 PC 가능)
  device: cpu                    # cpu = 검사 GPU 미사용 / gpu / auto = 여유 VRAM 보고 선택
  model: qwen2.5:7b              # 판단 정확도는 qwen3.5:9b 가 높음 (think: false 권장)
  cpu_threads: 4                 # CPU 모드 스레드 상한 (검사 SW 의 CPU 몫 보호, 0 = 전체)
  gpu_index: -1                  # auto 모드 대상 GPU (-1 = 여유가 가장 많은 GPU)
  gpu_min_free_mb: 6000          # auto: 이 이상 여유 VRAM 이 있을 때만 GPU
  gpu_max_util: 40               # auto: 그 GPU 사용률(%)이 이 이하일 때만 GPU
  keep_alive: ""                 # 모델 상주 시간 (빈 값 = 서버 기본 5분, GPU 는 "0" 권장)
  num_ctx: 8192
  timeout_s: 600
  think: null                    # qwen3 계열 생각 모드 (false = 끔, 빠름)
  script: ""                     # 주기 점검 지시문 파일 경로 (자연어)
  interval_min: 30

agent:                           # 경보 사건 분석 (룰 진단 + LLM 2차 의견 + 합의 관문)
  enabled: false
  use_llm: true                  # false = 룰 진단만 (LLM 없는 PC)
  min_severity: crit             # 이 등급 이상 경보만 분석
  batch_seconds: 60              # 첫 경보 후 이 시간 동안의 경보를 한 사건으로 묶음
  reason_first: true             # 서술 후 JSON 판단 (2단계 — 정확도↑·시간↑)
  runbook: ""                    # 원인·조치·담당 런북 교체 경로 (빈 값 = 내장 rules\runbook.yaml)
  gpu_log_tail_mb: 16            # 사건 시점에만 DLInfer.log 꼬리 N MB 조사
  casekb: true                   # 과거 사례 KB 유사 사례 첨부

email:                           # 사건 메일
  enabled: false
  transport: smtp                # smtp | graph (Microsoft 365 Graph API — OAuth2, 권장)
  graph:                         # transport: graph 일 때 (IT: Entra 앱 등록 + Mail.Send 권한)
    tenant_id: ""                # 테넌트 ID 또는 회사 도메인
    client_id: ""                # 앱(클라이언트) ID
    sender: ""                   # 보낼 사서함 (예: talog-alert@회사도메인)
    secret_env: TALOG_GRAPH_SECRET   # 클라이언트 암호 환경변수 (있으면 우선)
    client_secret_dpapi: ""      # 콘솔에서 입력한 암호의 암호문 (DPAPI)
  smtp_host: ""                  # 예: smtp.gmail.com / 사내 릴레이 / <테넌트>.mail.protection.outlook.com (Direct Send)
  smtp_port: 587
  security: starttls             # starttls | ssl | none
  username: ""                   # 비우면 인증 없이 발송 (사내 릴레이)
  password_env: TALOG_SMTP_PASSWORD   # 비밀번호 환경변수 (있으면 우선)
  password_dpapi: ""             # 콘솔에서 입력한 비밀번호의 암호문 (이 PC·이 사용자만 복호화)
  sender: ""                     # 비우면 username
  to: []                         # 항상 받는 사람
  roles: {}                      # 분석이 지목한 역할별 추가 수신자 — 예:
  #  vision_engineer: [vision@example.com]
  #  maintenance: [maint@example.com]
  #  quality: [quality@example.com]
  #  operator: [line@example.com]
  immediate: [crit]              # 이 등급은 묶음 없이 즉시 발송 (룰 판단, LLM 은 후속 메일)
  immediate_seconds: 10          # 즉시 메일 전 같은 순간 동반 경보를 모으는 시간(초)
  llm_followup: true             # 즉시 메일 뒤 LLM 2차 의견을 같은 스레드 후속 메일로
  min_severity: crit             # 이 등급 이상만 메일 (warn = 주의도 묶음 메일)
  min_interval_min: 5            # 묶음 메일 사이 최소 간격(분)
  max_per_hour: 10               # 시간당 상한 (즉시 메일 포함)
  outbox: true                   # 보낸 메일 사본을 alert_dir\outbox\*.eml 로 보관
  dry_run: false                 # true = SMTP 없이 outbox 에만 저장 (설치 초기 점검용)
  attach_json: true              # 근거 JSON 첨부
