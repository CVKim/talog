# talog watch 사건 분석 런북 — 원인·조치·담당의 닫힌 어휘
#
# 경보가 나면 에이전트가 근거를 모아 (1) 룰 진단(talog/agent/diagnoser.py, 원인 id 를 코드로 판정)과
# (2) LLM 2차 의견(이 문서의 description 을 읽고 같은 원인 id 중에서 고름)을 내고,
# 둘이 같은 원인을 말할 때만 '판단 일치'로 담당자에게 보낸다. 다르면 두 의견을 붙여
# 사람에게 넘긴다. 원인 id 는 코드와 짝이므로 바꾸지 말고, 문구·권고 조치·담당은
# 현장 사정에 맞게 이 파일만 고치면 된다.

params:
  gpu_fault_window_s: 300        # 경보 ±N초 안의 GPU 치명 오류·SEH 예외를 원인 근거로 본다
  not_init_after_restart_s: 300  # 재시작·모델 로드 후 N초 안의 거부는 미초기화로 본다
  slowdown_ratio: 1.5            # 최근 완료 소요 / 평소 중앙값 이 이 이상이면 '느려짐'
  exec_slowdown_ratio: 1.5       # 최근 executeV2 중앙값 / 직전 구간 중앙값
  recipe_change_window_min: 60   # 기종 교체(모델 로드) 후 N분 안의 결함 급증은 레시피 부적합 후보
  restart_merge_s: 30            # 30초 안의 재시작 흔적(풀 생성 5종 등)은 재시작 1회로 센다
  drift_ratio: 1.2               # 기준선 대비 점유 시간 배율이 이 이상이면 '시간 경과형 열화' 후보
  interval_tol_pct: 10           # 투입 간격 변화가 ±N% 안이어야 열화로 본다 (밖이면 부하 변화)

roles:
  operator: 현장 작업자
  vision_engineer: 비전 엔지니어
  maintenance: 설비 보전
  quality: 품질 담당

actions:
  monitor: 감시 지속 — 일시 현상인지 다음 검사들로 확인
  avoid_restart_now: 진행 중 검사가 끝날 때까지 재시작 보류 (지금 재시작하면 진행분 결과 소실)
  planned_restart: 투입이 멈춘 휴지 시점(쉬는 시간이 없는 라인은 라인과 협의한 계획 정지)에 재시작
  check_gpu_load: GPU 부하·동시 인퍼런스(채널 병렬·모델 instance) 점검
  adjust_cadence: 라인(PLC) 담당과 투입 간격 조정 협의
  check_gpu_health: GPU 드라이버·온도·전원 점검, 재시작 전에 exception.log·덤프 확보
  wait_model_load: 모델 로드가 끝날 때까지 대기 후 재투입 (재시작 불필요)
  check_model_files: 모델 로드 실패 여부·TRT 엔진 파일 확인
  report_platform: 플랫폼 팀에 '타임아웃 후 Seq 슬롯 미반환' 이슈 보고
  review_defect_image: 해당 inner id 의 결함 이미지 확인
  hold_product: 해당 제품 격리·재검
  check_upstream: 전공정(생산 공정) 이상 여부 확인 요청
  check_light_camera: 조명·카메라·트리거 계통 점검
  check_recipe: 기종 레시피(티칭·임계값) 확인
  free_storage: 이미지 저장 공간 확보
  check_cooling: GPU 냉각·팬·필터 점검
  collect_dump: exception.log·덤프(D:\AIV_LOG\Talos\dump) 확보 후 분석 의뢰
  plan_restart_for_leak: 메모리 추세 확인 후 계획 재시작 일정 수립
  restore_run_mode: 시뮬레이션 모드를 운영(검사) 모드로 되돌림
  review_error_log: 반복 에러 원문을 확인해 담당 모듈 지목
  escalate_to_human: 판단 불가 — 근거를 붙여 담당자에게 넘김
  collect_memory_snapshot: 재시작 전에 프로세스 메모리 상태(힙·핸들, VMMap 스냅샷이나 덤프) 확보 — 원인 모듈 확인용
  report_dev_team: 그룹별 점유 시간 추세와 단계별 증가표를 붙여 알고리즘·플랫폼 개발팀에 보고
  check_result_delivery: 설비(PLC·상위 시스템)가 검사 결과를 받고 있는지 먼저 확인 — 못 받으면 미검사로 처리된다
  check_comm_log: comm.log 가 계속 기록되는지(파일 크기·수정 시각, 회전, comm_fail.log, 디스크) 확인
  check_stuck_inspection: 남은 inner id 의 seq·알고리즘 로그로 어느 단계에서 멈췄는지 확인하고, 설비에서 그 제품이 미검사로 처리됐는지 확인

# 경보 룰 → 분석 계열. system 계열은 '룰 = 원인' 이라 원인 id 까지 적는다.
alert_family:
  no_insp_thread: reject
  capacity_drift: reject             # 처리 여유 감소 (유휴 스레드·일시 지연 내성) — 거부 전 조기 경보
  tact_drift: reject                 # 처리 시간 증가 (기동 기준 대비)
  insp_stall: reject
  img_timeout: reject
  reject_notready: reject
  defect_critical: defect
  defect_repeat: defect
  ng_streak: defect
  ng_rate: defect
  crash: system.process_crash
  restart_burst: system.restart_loop
  gpu_temp: system.gpu_overheat
  memory_trend: system.memory_leak
  storage_low: system.storage_full
  light_unstable: system.light_camera_fault
  grab_fail: system.light_camera_fault
  reject_busycam: system.light_camera_fault
  reject_sim: system.sim_mode_left
  alg_timeout: system.alg_timeout
  error_repeat: system.repeated_error
  llm_review: system.llm_review
  pattern: system.custom_pattern      # 사용자 정의 패턴 (패턴의 family 로 바꿀 수 있음)

families:
  reject:
    title: 검사 시작 거부·정체 (NoInspThread 계열)
    causes:
      throughput_saturation:
        name: 처리량 포화 — 검사 소요가 투입 간격보다 길어 Seq 스레드 고갈
        description: >-
          투입이 갑자기 몰리거나(휴지 뒤 연속 투입, 투입 간격 단축) 동시 인퍼런스가 겹쳐 GPU 커널
          시간이 늘면서, 검사 한 건의 소요가 그룹의 Seq 스레드 수 × 투입 간격을 넘어 스레드를 모두
          점유한 상태다. 근거: inspections.threads_needed_over_pool 이 1 에 가까움(소요 ÷ 투입 간격 ÷
          스레드 수 — 스레드 수를 모르면 duration_over_interval 이 1 이상), inspections.slowdown_ratio
          가 1.5 이상(최근 완료 소요가 평소보다 김), 경보 순간 inspections.inflight 가 많음,
          trend.interval_change_pct 가 -10% 보다 작음(투입이 빨라짐) 또는 gpu_log.exec_slowdown_ratio
          상승. GPU 치명 오류와 타임아웃은 없다. 투입 간격·GPU 커널이 그대로인데 점유 시간이 기동 뒤
          서서히 늘어 온 경우(trend.monotonic)는 이 원인이 아니라 progressive_slowdown 이다.
          PC3 2026-07-27 사례: 라인 휴지 뒤 약 100초 간격 연속 투입에서 인퍼런스가 중첩되며 채널
          소요가 21초에서 60~166초로 늘어 NoInspThread 가 났다. 이때 재시작하면 진행 중 검사 결과가
          소실된다.
        actions: [avoid_restart_now, check_gpu_load, adjust_cadence]
        notify: [vision_engineer]
      gpu_context_fault:
        name: GPU 컨텍스트 치명 오류 — 인퍼런스 스레드 전원 블로킹
        description: >-
          GPU 컨텍스트가 죽어(enqueueV3 cudaGetLastError, INFER_ERROR, 액세스 위반 0xc0000005)
          인퍼런스를 기다리는 스레드가 모두 멈춘 상태다. 근거: gpu_log.fatal_near 또는
          gpu_log.infer_errors_near 가 1 이상이거나 errors.seh_near 가 1 이상(경보 ±5분).
          검사 소요 증가 없이 갑자기 거부가 시작될 수 있고, 인퍼런스가 먼저 멈춘 뒤 오류가
          나중에 반환되므로 오류 로그가 거부보다 몇 초 뒤에 찍힐 수 있다(±5분 안이면 원인 근거).
          Tenneco 2026-07-30 11:21 사례: NoInspThread 5초 뒤 enqueueV3 오류 38건, 이어서 액세스
          위반과 크래시. 이때 진행 중 검사가 많아 보여도 처리량 포화가 아니다. 재시작 전에
          exception.log·덤프를 확보해야 원인 분석이 가능하다.
        actions: [collect_dump, check_gpu_health, planned_restart]
        notify: [vision_engineer, maintenance]
      slot_leak_timeout:
        name: 타임아웃 후 Seq 슬롯 미반환
        description: >-
          이미지 처리 타임아웃(IMG_TIMEOUT) 뒤 Seq 슬롯이 반환되지 않아 쓸 수 있는 스레드가 줄어든
          상태다(플랫폼 CommonSeq 타임아웃 경로의 알려진 결함). 근거: timeouts.img_timeout_30min 이
          1 이상이고 그 뒤에 거부가 발생, 진행 중 검사(inspections.inflight)가 1 이하인데도 거부,
          GPU 치명 오류 없음. 재시작 전까지 회복되지 않으므로 투입이 없는 휴지 시점에 계획
          재시작하고 플랫폼 팀에 보고한다.
        actions: [planned_restart, report_platform]
        notify: [vision_engineer]
      progressive_slowdown:
        name: 시간 경과형 처리 열화 — 기동 뒤 점유 시간이 누적 증가해 스레드 여유 소진
        description: >-
          투입 간격과 일의 양은 그대로인데 프로세스가 기동(또는 기종 교체)된 뒤 시간이 지날수록 검사
          한 건이 Seq 스레드를 잡고 있는 시간(점유)이 계속 늘어 예비(유휴) 스레드가 줄어든 상태다.
          근거: trend.hold_ratio 가 기준선보다 큼(1.2 이상) 또는 capacity.idle_median 이
          capacity.idle_baseline 보다 작음, trend.monotonic 이 true(꾸준한 증가),
          trend.interval_change_pct 가 ±10% 안(부하 변화 아님), gpu_log.exec_slowdown_ratio 가 1.5
          미만(GPU 경합 아님). trend.groups_rising 에 여러 그룹이 있으면 특정 알고리즘 하나보다
          프로세스 전체가 같이 쓰는 자원(힙·할당자, 스레드 공유 자원)이 느려진 공통 원인이다.
          capacity.tolerance_s(한계 − p99 점유)가 작을수록 transient(여러 그룹 동시 일시 지연) 한
          번에 NoInspThread 가 난다. 재시작하면 회복되므로 다음 정지 시점(쉬는 시간이 없는 라인은
          라인과 협의한 계획 정지)에 재시작하고, 그 전에 메모리 상태를 확보해 원인 모듈을 찾는다.
          phases 의 단계별 증가를 개발팀 보고에 붙인다. 투입 간격 조정·GPU 점검은 이 원인과 무관하다.
          경보 순간 진행 중 검사가 있으면 지금 바로 재시작하지 않는다. 풍산 2호기 2026-10-12 사례:
          기동 5일 뒤 측면 그룹 점유가 기준의 2배를 넘고 유휴 스레드가 4→3개로 줄어든 상태에서 30초간
          전 그룹 동시 지연이 겹쳐 그룹 10~12 가 거부됐다.
        actions: [planned_restart, collect_memory_snapshot, report_dev_team]
        notify: [vision_engineer]
      completion_signal_lost:
        name: 완료 신호 끊김 — 처리는 끝나는데 결과 회신(INSPECT_END)이 안 보임
        description: >-
          검사 요청은 계속 들어오고 최근 도착 순간 유휴 스레드도 스레드 수에 가까우며(처리가 막혔다면
          0 쪽으로 떨어진다) seq 점유도 평소대로인데, 결과 회신(V2M_INSPECT_END)만 들어오지 않아 진행
          중 검사가 쌓인 상태다. 근거: inspections.last_end_age_s(마지막 완료 뒤 경과)가 60초 이상이고
          그 뒤 inspections.starts_since_last_end 가 20건 이상(또는 ends_10min 이 starts_10min 의 절반
          미만), inspections.wait_threads_recent 가 스레드 수(capacity.pool) − 1 이상. 이때 진행 중 수와 소요
          배율(duration_over_interval)은 회신이 끊겨 부푼 값이라 처리량 포화의 근거가 아니다. comm 로그
          기록이 멈췄거나(회전·디스크·로거) 설비로 결과 송신이 끊긴 경우다 — 설비가 결과를 못 받으면
          미검사로 처리되므로 송신 여부부터 확인한다. 재시작이나 투입 간격 조정은 이 원인과 무관하다.
          Tenneco 2026-07-30 13:55 사례: comm.log 기록이 InspStarter·seq 보다 10분 먼저 끝나 검사 정체
          경보가 났고, 그동안 도착 순간 유휴 스레드는 3개 중 2~3개, seq 점유는 0.61초로 평소대로였다.
        actions: [check_result_delivery, check_comm_log]
        notify: [vision_engineer]
      isolated_stall:
        name: 단건 정체 — 검사 몇 건만 완료 신호 없이 남음 (스레드는 남아 있음)
        description: >-
          검사 정체 경보(insp_stall)인데 완료 신호(INSPECT_END) 없이 남은 검사가 한두 건뿐이고(스레드 수의
          절반 이하, 스레드 수를 모르면 2건 이하) 최근 도착 순간 유휴 스레드도 남아 있는 상태다. 근거:
          inspections.inflight 가 작음, inspections.wait_threads_recent 에 1 이상이 있음, 다른 검사는
          끝나거나(recent_durations_s) 라인이 멈춤. 스레드가 모자란 것이 아니므로 처리량 포화가 아니다 —
          duration_over_interval 은 남은 한 건의 경과라 부푼 값이다. 그 검사의 처리(특정 이미지·알고리즘)가
          멈췄거나 그 건의 회신만 빠진 경우다. 남은 inner id(inspections.inflight_ids)의 seq·알고리즘
          로그로 어느 단계에서 멈췄는지 보고, 설비에서 그 제품이 미검사로 처리됐는지 확인한다. Tenneco
          2026-07-28 15:53 사례: 재시작 10분 뒤 라인이 멈춘 상태에서 그룹 3 검사 1건이 491초째 남았다.
        actions: [check_stuck_inspection, check_result_delivery]
        notify: [vision_engineer]
      not_initialized:
        name: 기동·모델 로드 직후 미초기화
        description: >-
          프로세스 재시작이나 기종 교체 직후 모델 로드가 끝나기 전에 검사 요청이 들어온 상태다
          ('All Seq thread is running or not initialized' 의 미초기화 쪽). 근거:
          restarts.since_restart_s 가 300 이하이거나 model_load.pending 이 true, 진행 중 검사
          없음. 로드가 끝나면 스스로 해소되므로 재시작하지 않는다.
        actions: [wait_model_load, check_model_files]
        notify: [operator]
  defect:
    title: 결함 판정 경보 (치명 결함·빈발·연속 NG)
    causes:
      critical_defect:
        name: 치명 결함 검출
        description: >-
          치명 결함으로 지정한 결함명이 검출됐고 전체 NG 비율과 연속 NG 는 평소 수준이다. 근거:
          defects.critical_hits 가 있고 defects.streak 가 짧으며 defects.ng_rate_recent 가
          기준선(defects.ng_rate_baseline)보다 크게 오르지 않음, 조명·그랩·타임아웃 오류 없음.
          실제 불량일 가능성이 높으므로 해당 inner id 의 결함 이미지를 확인하고 제품을 격리한다.
        actions: [review_defect_image, hold_product]
        notify: [quality]
      defect_burst:
        name: 동일 결함 빈발·연속 NG — 공정 이상 또는 과검출
        description: >-
          같은 결함명이 짧은 시간에 반복되거나 NG 가 연속된다. 조명·그랩·타임아웃 오류가 없고 기종
          교체도 없다면 전공정의 실제 불량 연속이거나 특정 결함의 과검출이며, 이미지로만 가를 수
          있다. 근거: defects.top 에서 한 결함명이 대부분, defects.streak 가 길거나 빈발 경보,
          model_load.minutes_since 가 60 초과 또는 없음.
        actions: [review_defect_image, check_upstream, check_recipe]
        notify: [quality, vision_engineer]
      recipe_mismatch:
        name: 기종 교체 후 과검 — 티칭·임계값 부적합
        description: >-
          기종 교체(모델 로드) 직후 결함이 급증한다. 새 기종의 티칭·임계값이 맞지 않아 과검할
          가능성이 크다. 근거: model_load.minutes_since 가 60 이하이고
          defects.ng_rate_recent 가 defects.ng_rate_before_change 보다 크게 높음. Tenneco 사례:
          기종 구간 NG 가 6.3% 에서 68% 로 계단식 상승.
        actions: [check_recipe, review_defect_image]
        notify: [vision_engineer]
      system_forced_ng:
        name: 시스템 원인 강제 NG — 타임아웃·그랩·조명
        description: >-
          결함이 아니라 시스템 문제로 NG 가 강제된 경우다. 알고리즘 타임아웃(TIME_OUT NG 강제
          판정), 그랩 실패, 조명 불안정이 결함 급증 구간에 있다. 근거: timeouts.alg_timeout_30min
          또는 errors 의 GRAB_FAIL·LIGHT_UNSTABLE 이 1 이상, 결함명이 TIME_OUT 류. 제품 불량으로
          판단하지 말고 설비·GPU 부하부터 점검한다.
        actions: [check_light_camera, check_gpu_load]
        notify: [maintenance, vision_engineer]
  system:
    title: 설비·프로세스 상태 경보
    causes:
      process_crash:
        name: 프로세스 크래시
        description: >-
          talos 프로세스가 unhandled exception 으로 종료됐다. 진행 중 검사 결과가 소실된다. 근거:
          crash 경보, errors.seh_near, gpu_log 의 오류 동반 여부. 재기동 전에 exception.log·덤프를
          확보한다.
        actions: [collect_dump, check_gpu_health]
        notify: [vision_engineer]
      restart_loop:
        name: 재시작 반복
        description: >-
          짧은 시간에 재시작이 반복된다. 재시작으로 해결되지 않는 문제일 가능성이 크다. 근거:
          restarts.count_30min(30초 안의 흔적은 1회로 병합한 실제 재시작 수)과 kill 스크립트 이력.
          실제 재시작 수가 경보 기준보다 적으면 오경보다.
        actions: [collect_dump, escalate_to_human]
        notify: [vision_engineer]
      gpu_overheat:
        name: GPU 과열
        description: GPU 온도가 임계를 넘었다. 근거 gpu_now 의 온도·사용률. 냉각 계통을 점검한다.
        actions: [check_cooling]
        notify: [maintenance]
      memory_leak:
        name: 메모리 증가 추세 (릭 의심)
        description: 프로세스 메모리 상한이 시간당 일정 이상 계속 오른다. 근거 memory. 계획 재시작 일정을 잡는다.
        actions: [plan_restart_for_leak]
        notify: [vision_engineer]
      storage_full:
        name: 이미지 저장 공간 부족
        description: 이미지 저장 공간이 기준 아래로 줄었다. 설비 비상 정지로 이어질 수 있다.
        actions: [free_storage]
        notify: [operator, maintenance]
      light_camera_fault:
        name: 조명·카메라 계통 이상
        description: 조명 컨트롤러 불안정, 그랩 실패, 카메라 점유(BusyCam) 중 하나가 났다. 설비 정지로 이어질 수 있다.
        actions: [check_light_camera]
        notify: [maintenance]
      sim_mode_left:
        name: 시뮬레이션 모드 방치
        description: 설비가 시뮬레이션 모드라 실제 검사 요청이 거부된다.
        actions: [restore_run_mode]
        notify: [operator]
      alg_timeout:
        name: 알고리즘 타임아웃
        description: 알고리즘 처리 시간이 임계를 넘어 TIME_OUT NG 로 강제 판정된다. GPU 부하·병목을 확인한다.
        actions: [check_gpu_load]
        notify: [vision_engineer]
      repeated_error:
        name: 동일 에러 반복
        description: 같은 에러가 짧은 시간에 반복된다. 근거 errors.top. 원문을 확인해 담당 모듈을 지목한다.
        actions: [review_error_log]
        notify: [vision_engineer]
      llm_review:
        name: LLM 주기 점검 소견
        description: 주기 점검 LLM 이 이상 소견을 냈다. 근거가 약하면 감시만 지속한다.
        actions: [monitor]
        notify: [vision_engineer]
      custom_pattern:
        name: 사용자 지정 로그 패턴 발생
        description: >-
          사용자가 지정한 로그 문구가 기준 횟수 이상 나왔다. 근거: patterns 의 원문 줄. 원문이
          어떤 모듈의 어떤 실패인지 해석하고, 같은 구간의 errors·timeouts·restarts 와 함께
          보아 영향(검사 소실·NG 강제·설비 정지 위험)을 판단한다. 원문만으로 원인을 특정할 수
          없으면 review_error_log 와 escalate_to_human 을 고른다.
        actions: [review_error_log]
        notify: [vision_engineer]
