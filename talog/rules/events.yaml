# talog 이벤트 추출 룰 사전
#
# 카테고리별 룰 목록. 각 룰:
#   kind      : 이벤트 종류 (영문 대문자)
#   msg       : 메시지 정규식 (필수). 이름 있는 그룹으로 필드 캡처.
#   header    : 헤더 정규식 (선택)
#   level     : 레벨 일치 (선택: Debug/Info/Error/Verbose)
#
# 캡처 그룹 이름 규약: inner_id, product_id, roi_idx, alg_list, model,
#                     value(숫자 ms), status, block, wait, name
# 주의: seq/InspStarter/Comm 등 talos-platform 소속 로그의 메시지는 코드 근거가
#       없으므로(레포 외부) 실측 기반이다. 플랫폼 업데이트 시 이 파일만 수정한다.

alg:
  - kind: RESET
    header: 'BaseInspector::Reset$'
    msg: 'Reset\. inner id: (?P<inner_id>\S+), product id: (?P<product_id>.*)$'
  - kind: INIT_START
    header: 'DeepLearningInspector::Initialize$'
    msg: '^\+Initialize$'
  - kind: INIT_END
    header: 'DeepLearningInspector::Initialize$'
    msg: '^-Initialize$'
  - kind: FEED
    header: 'BaseInspector::SetInputImage$'
    msg: 'Feed input image\. roi index: (?P<roi_idx>\d+), MIL_ID: (?P<extra>.*)$'
  # FOV 선별 실패: 메시지 선두에 inner_id 보유 (Tenneco PickSpecificFov)
  - kind: FOV_FAIL
    header: 'Dataflow::PickSpecificFov::Execute$'
    msg: '^(?P<inner_id>\d{12,}) \) can not find result defect name : (?P<name>.+)$'
  - kind: MODEL_FAIL
    msg: 'Failed to create ALG Blocks - DLMODEL: (?P<model>\S+)'
  - kind: MODEL_FAIL
    msg: 'Failed to create ALG Blocks - RuleBase: (?P<model>\S+)'
  - kind: BLOCK_START
    level: Info
    header: 'Dataflow::(?P<block>\w+)::Execute$'
    msg: '.*'
  - kind: TACT_PRE
    msg: 'Model : (?P<model>.+?), PreProcessing Tact = (?P<value>[\d.]+)'
  - kind: TACT_INFER
    msg: 'Model : (?P<model>.+?), InspectMC Tact = (?P<value>[\d.]+)'
  # 후처리 Tact 3형 지원: 'Model : X, PostProcessing' / 'Model Load: X, PostProcessing'
  # / 'Model Load: X,<블록명> PostProcessing' (Tenneco MeasurePointToBlobDistance)
  - kind: TACT_POST
    msg: 'Model(?: Load)?\s*:\s*(?P<model>[^,]+?),\s*(?:[\w:]+ )?PostProcessing Tact = (?P<value>[\d.]+)'
  - kind: TACT_ETC
    msg: '(?P<block>[\w:]+)- (?:Processing )?Tact = (?P<value>[\d.]+)'
  # 폴백: 모델명 없는 InspectMC (OCR/바코드/룰 후처리 블록 커버)
  - kind: TACT_INFER
    msg: 'InspectMC Tact = (?P<value>[\d.]+)'

inspstarter:
  - kind: INSP_START
    msg: 'eAIVProtocol_M2V_InspStart is arrived\. Waiting thread count = (?P<value>\d+), innerid: (?P<inner_id>\S+), productId: (?P<product_id>\S*)'
  # 존(groupId) 포함 수신 라인 (CommAiv.cpp) — 다존 설비 거부의 존 귀속용
  - kind: INSP_RECV
    header: 'CCommAiv::OnCommRecv$'
    msg: 'Recive M2V_INSPECT_START\. innerId: (?P<inner_id>\S+), productId: (?P<product_id>[^,]*), groupId: (?P<value>\d+)'
  - kind: INSP_REJECT
    msg: 'All Seq thread is running or not initialized'
  # 코드 검증(InspStarter.cpp): NoInspThread 외의 검사 거부 경로들
  - kind: REJECT_BUSYCAM
    msg: 'Device acquire failed \(BusyCam\)'
  - kind: REJECT_NOTREADY
    msg: 'Attempting to start inspect'
  - kind: REJECT_SIM
    msg: 'but current mode is simulation'
  - kind: STORAGE_LOW
    msg: 'available storage space for saving the images is less than'
  - kind: LIGHT_UNSTABLE
    msg: 'Light device is unstable'
  - kind: RECIPE_FAIL
    msg: 'Setbin ReadInfo failed'

seq:
  # 플랫폼 로그의 오타(STRAT) 그대로 매칭한다
  - kind: SEQ_START
    msg: '\[STRAT\] start seq async\. inner id: (?P<inner_id>\S+), product id: (?P<product_id>\S*)'
  - kind: SEQ_GROUP
    msg: 'Group Start (?P<value>\d+), Inner ID : (?P<inner_id>\S+)'
  # 코드 검증(CommonSeq.cpp): 타임아웃/그랩실패/검사 처리시간
  - kind: ALG_TIMEOUT
    msg: 'Algorithm timeout : (?P<value>[\d.]+)\s*msec, image index : (?P<roi_idx>\d+)'
  - kind: IMG_TIMEOUT
    msg: '\[TIMEOUT\] Image processing timeout\. so return\. innerId: (?P<inner_id>\S+)'
  - kind: GRAB_FAIL
    msg: '\[FAIL\] Grab fail!'
  - kind: PROC_TIME
    msg: '\| Processing Time : (?P<value>[\d.]+)\s*msec'
  - kind: SEQ_FINISH
    msg: 'CommonSeq CheckFinish done: (?P<value>[\d.]+)\s*msec'
  # 검사 시작->결과 송신 총 소요 (CommonSeq.cpp m_nInspTime — 존 단위 사이클타임)
  - kind: SEND_RESULT
    msg: 'SendResultToOthers done: (?P<value>\d+)\s*msec'
  # 이미지 저장 경로 지연 (100ms 초과 시에만 로그 — 자체 필터된 이상신호)
  - kind: SYMLINK_SLOW
    msg: 'fs::create_directory_symlink: (?P<value>\d+)\(ms\)'
  - kind: REMAIN_TOTAL
    msg: '\[TOTAL\] innerId: (?P<inner_id>\S+), started alg list: (?P<alg_list>.*)$'
  - kind: REMAIN
    msg: '\[REMAIN\] innerId: (?P<inner_id>\S+), remain alg list: (?P<alg_list>.*)$'

# 고케이던스 사이트의 MOTION/KEEP_ALIVE 홍수를 제외하고 검사 라이프사이클과
# 모델 로드 메시지만 수집한다 (M2V_INSPECT_START 는 InspStarter 로 대체)
comm:
  - kind: COMM_MSG
    msg: '(?P<name>V2M_(?!REQUEST_MOTION|KEEP_ALIVE)[A-Z_]+|M2V_MODEL_LOAD[A-Z_]*),(?P<extra>.*)$'

pool:
  - kind: POOL_CREATE
    msg: 'WorkerThreadPool is created: (?P<name>e\w+)$'
  - kind: POOL_DESTROY
    msg: 'StopAllThreadJob for (?P<name>e\w+)$'

exception:
  # SafeCall 래퍼가 잡은 SEH 예외 (액세스 위반 등) — status=예외코드,
  #   roi_idx=ImgIdx, block=발생 위치, name=Talos ID
  - kind: EXC_SAFE
    msg: '\[Exception\] ThreadId: \d+, Talos ID: (?P<name>\S+?), ImgIdx: (?P<roi_idx>\d+), Code: (?P<status>0x[0-9a-fA-F]+), Location: (?P<block>\S+)'
  - kind: EXC_CALLER
    msg: '\[Caller\] (?P<name>\S+) ! (?P<block>\S+) \+ (?P<extra>0x[0-9a-fA-F]+)'
  - kind: CRASH
    msg: '\[exception_callback\] exception occurred'
  - kind: EXC_REDIRECT
    msg: '^(?P<extra>.*), @(?P<name>.+\.log)$'

inspskipper:
  - kind: RECIPE_LOAD
    msg: 'Load InspSkipper recipe : (?:\[(?P<value>\d+)\])?(?P<name>\S+)'

comm_fail:
  - kind: COMM_FAIL
    msg: 'RecvLength error.*error code :(?P<value>\d+)'

# DLInfer: GPU 실행 단위 계측. executeV2 = 순수 GPU 커널 시간(ms),
# CTRTLoader::LoadDLModel = 모델이 어느 GPU 에 올라갔는지 + 로드 시간
dlinfer:
  # CPU 접두는 OpenVino 백엔드 사이트 대응 (status = 디바이스 인덱스)
  - kind: DLINFER_EXEC
    msg: '(?:GPU|CPU): (?P<status>\d+) - Model: (?P<model>\S+?), DeviceIdx:\d+, executeV2 Tact = (?P<value>[\d.]+)'
  # 인퍼런스 스테이지별 Tact (모델 상세 분해용): name=스테이지, value=ms
  #   Infer 는 합계(전처리+복사+실행+검증), 나머지는 개별 스테이지
  - kind: DLINFER_STAGE
    msg: '(?:GPU|CPU): (?P<status>\d+) - Model: (?P<model>\S+?), DeviceIdx:\d+, (?P<name>ProcessInput|copyInputToDevice|VerifyOutput|Infer) Tact = (?P<value>[\d.]+)'
  - kind: MODEL_GPU_LOAD
    header: 'CTRTLoader::LoadDLModel$'
    msg: 'GPU: (?P<status>\d+) - Model: (?P<model>\S+?), DeviceIdx:\d+, Tact = (?P<value>[\d.]+)'
  # v1.4 GPU 리소스 계측 (DLInfer.cpp/DLInferOnGPU.cpp 실코드 대조)
  # GPU_STATUS: NVML 스냅샷(신규 빌드, 인퍼런스당 2회) — status=GPU idx,
  #   value=VRAM 사용량(MB), name=온도(C)
  - kind: GPU_STATUS
    msg: '\[GPU STATUS\] GPU (?P<status>\d+) \| Mem Used: (?P<value>[\d.]+) MB \| Temp: (?P<name>\d+) C'
  # GPU_MEMLOAD: 모델 로드 시 cudaMemGetInfo 델타 — value=로드 후 사용량(MB),
  #   name=증분(MB), status=프로세스 로컬 GPU idx (물리 idx 는 console 로그로 보정)
  - kind: GPU_MEMLOAD
    msg: 'GPU: (?P<status>\d+) - Model: (?P<model>\S+?), DeviceIdx:\d+, Memory = [\d.]+->(?P<value>[\d.]+) \((?P<name>-?[\d.]+)\)MB'
  # CUDA_MEMPOOL: WDDM 메모리풀 계측(Tenneco 계열) — value=usedCur(MB),
  #   extra=usedHigh(MB), status=dev idx, name=시점 라벨
  - kind: CUDA_MEMPOOL
    msg: '\[CUDA MEMPOOL\] (?P<name>.+?) dev=(?P<status>\d+) \| usedCur=(?P<value>[\d.]+)MB usedHigh=(?P<extra>[\d.]+)MB'
  # GPU_WAIT: 비상주(on memory infer=0) 경로의 GPU 전역 락 대기 (ms)
  - kind: GPU_WAIT
    msg: 'WaitForCriticalSection Tact = (?P<value>[\d.]+)'
  # GPU 컨텍스트 사망 (enqueueV3 실패 — 스레드 전원 블로킹의 근원)
  - kind: GPU_FATAL
    msg: 'enqueueV3 cudaGetLastError: (?P<extra>.+)$'
  - kind: MODEL_FAIL
    msg: 'Could not find trt : (?P<model>\S+?),'
  - kind: INFER_ERROR
    msg: '(?P<name>INPUT_TENSOR_ERROR|EXECUTE_ERROR|VERIFY_OUTPUT_ERROR|OUTPUT_TENSOR_ERROR)'

# 콘솔 로그: 모델의 물리 GPU 배치 이벤트 (2-GPU 설비에서 GPU #0/#1 구분의
# 유일한 소스 — DLInfer.log 의 GPU:/DeviceIdx: 는 프로세스 로컬 0 고정)
console:
  - kind: GPU_MODEL_LOAD
    msg: '\[Success\] Load (?P<model>\S+) Model On GPU #(?P<value>\d+)'

# 프로세스 리소스 사용량 (5초 주기): value=RAM(MB), status=CPU%, name=스레드 수
processusage:
  - kind: USAGE
    msg: 'CPU Usage : (?P<status>[\d.]+)%\s+Memory Usage : (?P<value>[\d.]+)Mb\s+thread count : (?P<name>\d+)'

# 종속성 그래프: 검사별 alg 노드 비활성(=레시피 조건에 의한 정상 스킵) 판정
relgraph:
  - kind: ALG_DEACT
    msg: 'IID\[(?P<inner_id>[^\]]+)\]\s+GroupID\[\d+\] \([^)]+\) - \(alg, (?P<value>\d+)\) connection val: DEACTIVATE_VAL'

inspectmng: []

# 시퀀스 정지: value>0 이면 진행 중 검사가 스레드 정지로 강제 중단된 것
stopthread:
  - kind: STOP_ALL
    header: 'SSeqGroupMng::StopAllThreads$'
    msg: '\+ Working Seq Thread count before stop: (?P<value>\d+)'
