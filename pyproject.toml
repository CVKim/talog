[project]
name = "talog"
version = "2.2.0"
description = "AI 비전 로그 운영 플랫폼 — 실시간 감시 · 룰+LLM 사건 판단 · 메일 알림 · 진단 리포트 · 자연어 질의"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Gwangyeol Kim" }]
dependencies = [
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pyflakes>=3.0",
    "pyinstaller>=6.0",
]

[project.scripts]
talog = "talog.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# 하위 패키지(console·mcp·mcp.tools …)를 손으로 적지 않는다 — 새 패키지가 휠에서 빠지지 않게 자동으로 찾는다.
# rules·web 처럼 __init__.py 없는 데이터 폴더도 namespaces 로 함께 잡힌다.
[tool.setuptools.packages.find]
include = ["talog", "talog.*"]
namespaces = true

[tool.setuptools.package-data]
"talog" = ["web/*.html", "web/css/*.css", "web/js/*.js", "web/views/*.html", "web/partials/*.html",
           "assets/*", "claude_kit/*.md", "claude_kit/skills/*/*.md",
           "claude_kit/skills/*/templates/*.html"]
"talog.rules" = ["*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
