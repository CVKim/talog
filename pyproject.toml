[project]
name = "talog"
version = "2.0.0"
description = "AI 비전 로그 운영 플랫폼 — 실시간 감시 · 룰+LLM 사건 판단 · 메일 알림 · 진단 리포트 · 자연어 질의"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Gwangyeol Kim" }]
dependencies = [
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pyinstaller>=6.0",
]

[project.scripts]
talog = "talog.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["talog", "talog.rules"]

[tool.setuptools.package-data]
"talog" = ["console.html"]
"talog.rules" = ["*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
