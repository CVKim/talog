# talog 설정 — AI 비전 로그 운영 플랫폼 2.0
# 보통은 콘솔(run_talog.bat → 설정 화면)에서 고칩니다. 직접 고쳐도 되며, 콘솔로 저장하면
# 이전 파일은 .bak 으로 남습니다. 흐름 순서: 수집 → 탐지 → 판단 → 알림.

# ── 1 수집 ─────────────────────────────────────────────
site: ""                       # 설비 이름 (메일 제목·기록에 표시, 예: PC3, CMFB#1)
log_root: D:\AIV_LOG\Talos     # talos 로그 루트 — 오늘 YYYY_MM\DD 폴더를 자동으로 따라감
data_dir: D:\AIV_LOG\TalogWatch  # 경보·사건·리포트 저장 폴더
tracking: core                 # core = 핵심 로그 9종(저부하) | all = 일자 폴더 전체 | [파일 목록]

# ── 2 탐지 ─────────────────────────────────────────────
rules:
  builtin: {}                  # 기본 규칙 조정 — 예: {grab_fail: {severity: warn}, img_timeout: {count: 3, window_min: 10},
  #                              ng_streak: {enabled: true, count: 10}, gpu_temp: {celsius: 80}}
  custom: []                   # 사용자 규칙 — 예:
  #  - type: defect             # 판정 결함명 (Comm.log INSPECT_END 의 NG 결함, 와일드카드 *)
  #    name: 치명 결함
  #    match: [BOOT_DAMAGED, "*CRACK*"]
  #    severity: crit           # crit = 즉시 메일 | warn = 묶음 메일 | info = 기록만
  #    count: 1                 # window_min 분 안에 count 번이면 경보 (1 = 한 번만 나와도)
  #    window_min: 10
  #  - type: log                # 로그 문구 (정규식은 "re:" 로 시작)
  #    name: GPU 컨텍스트 치명 오류
  #    match: enqueueV3 cudaGetLastError
  #    files: [DLInfer.log]     # 핵심 로그 밖 파일이면 그 파일도 같이 읽음
  #    severity: crit
  #    count: 1

# ── 3 판단 ─────────────────────────────────────────────
ai:
  llm: false                   # true = 룰 진단 + Qwen 교차 확인 / false = 룰 진단만
  url: http://127.0.0.1:11434  # Ollama 주소
  model: qwen2.5:7b            # qwen3.5:9b 가 판단이 더 정확
  device: cpu                  # cpu(검사 GPU 미사용) | gpu | auto(여유 VRAM 보고 선택)

# ── 4 알림 ─────────────────────────────────────────────
mail:
  provider: "off"              # off | gmail | m365 | smtp
  to: []                       # 받는 사람
  roles: {}                    # 분석이 지목한 담당 역할별 추가 수신자 — {vision_engineer: [..], maintenance: [..]}
  digest: false                # true = 주의 등급도 묶어서 메일 (심각은 늘 즉시)
  account: ""                  # gmail/smtp 로그인 계정
  sender: ""                   # m365: 보낼 사서함 / 그 밖: 보내는 사람 표시 (비우면 account)
  host: ""                     # smtp 만
  port: 587
  security: starttls           # starttls | ssl | none
  tenant_id: ""                # m365 만
  client_id: ""
  secret: ""                   # 비밀번호·암호는 콘솔에서 입력 → DPAPI 암호문만 저장 (평문 금지)
notify:
  toast: true                  # Windows 토스트
  webhook: ""                  # Teams·Slack·사내 서버 (비우면 끔)

advanced: {}                   # 엔진 세부값 직접 조정 (poll_seconds, agent.batch_seconds, llm.cpu_threads 등) — 보통 비움
